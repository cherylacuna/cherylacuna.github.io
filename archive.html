<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>inventory / scattered</title>
    <style>
        body {
            font-family: "Times New Roman", Times, serif;
            font-size: 10pt;
            background-color: #fff;
            margin: 0;
            padding: 50px;
            overflow-x: hidden; /* Prevents stray items from causing scrollbars */
        }

        header {
            text-align: center;
            border-bottom: 1px solid #000;
            margin-bottom: 100px;
            padding-bottom: 20px;
        }

        /* The Canvas */
        .inventory-canvas {
            position: relative;
            max-width: 1200px;
            margin: 0 auto;
            min-height: 1500px; /* Gives you plenty of vertical room to scatter */
        }

        /* Individual Item Wrapper */
        .item-wrapper {
            position: absolute; /* Allows for the "scattering" */
            display: inline-block;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s ease-in-out;
            z-index: 1;
        }

        .item-wrapper:hover {
            z-index: 10; /* Brings the hovered item to the front */
            transform: scale(1.05);
        }

        .item-wrapper img {
            width: 180px; /* Smaller, varying sizes feel more scattered */
            height: auto;
            display: block;
            border: 1px solid #ddd;
            filter: grayscale(10%) contrast(90%);
        }

        /* Label Styling */
        .label {
            display: block;
            margin-top: 8px;
            font-size: 9pt;
            background: #fff; /* Ensures text is readable if items are close */
        }

        .catalog-code {
            font-weight: bold;
            color: blue;
        }

        /* The hidden detail that reveals on hover */
        .detail-text {
            display: block;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease, color 0.3s ease;
            font-size: 8pt;
            text-transform: uppercase;
            color: transparent;
            margin-top: 2px;
        }

        .item-wrapper:hover .detail-text {
            max-height: 40px; /* Expands to show the title */
            color: fuchsia;
            border-top: 1px dotted fuchsia;
            padding-top: 2px;
        }

        /* Scattering Classes - Apply these to your items manually */
        /* You can adjust these % values to move things around the screen */
        .pos-1 { top: 0; left: 10%; }
        .pos-2 { top: 150px; left: 55%; }
        .pos-3 { top: 350px; left: 25%; }
        .pos-4 { top: 500px; left: 70%; }
        .pos-5 { top: 750px; left: 15%; }
        .pos-6 { top: 900px; left: 50%; }

    </style>
</head>
<body>

    <header>
        <h1>archival inventory: cheryl acuna</h1>
        <p style="font-size: 8pt; letter-spacing: 2px;">[CLICK RECORD FOR FULL PROVENANCE]</p>
    </header>

    <div class="inventory-canvas">

        <!-- Item 001 -->
        <a href="item-001.html" class="item-wrapper pos-1">
            <img src="Blog/1994.jpg" alt="Item 001">
            <div class="label">
                <span class="catalog-code">[001]</span>
                <span class="detail-text">MISHIMA, YUKIO. "SUN & STEEL", 1954.</span>
            </div>
        </a>

        <!-- Item 002 -->
        <a href="item-002.html" class="item-wrapper pos-2">
            <img src="Blog/Rose.png" alt="Item 002">
            <div class="label">
                <span class="catalog-code">[002]</span>
                <span class="detail-text">PRADA. "DISTRESSED RIBBON MARY JANE", 2003</span>
            </div>
        </a>

        <!-- Item 003 -->
        <a href="item-003.html" class="item-wrapper pos-3">
            <img src="Blog/PXL_20250404_010153759.jpg" alt="Item 003">
            <div class="label">
                <span class="catalog-code">[003]</span>
                <span class="detail-text">BLIMP. "SACCHARINE" MUSIC VIDEO STAMP, 2026</span>
            </div>
        </a>

        <!-- Item 004 -->
        <a href="item-004.html" class="item-wrapper pos-4">
            <img src="images/rare-book-thumb.jpg" alt="Item 004">
            <div class="label">
                <span class="catalog-code">[004]</span>
                <span class="detail-text">DERRIDA. "ARCHIVE FEVER", FIRST EDITION PAPERBACK</span>
            </div>
        </a>

        <!-- Add more items by incrementing the pos- class or the ID -->

    </div>

</body>
</html>
